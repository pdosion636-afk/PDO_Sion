<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Renungan Harian - PDO SION</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="PDO SION.css"
    >

</head>


<body>

<script src="auth.js"></script>


<nav class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        PDO SION
    </a>


    <div class="nav-links">

        <a href="index.html">
            Beranda
        </a>

        <a href="kegiatan.html">
            Kegiatan
        </a>

        <a
            href="renungan.html"
            class="active"
        >
            Renungan
        </a>

        <a href="doa.html">
            Doa
        </a>

        <a href="kontak.html">
            Kontak
        </a>

        <button
            onclick="logoutPDO()"
            class="logout-button"
        >
            Keluar
        </button>

    </div>

</nav>


<main class="devotion-page">

    <div class="devotion-container">


        <div class="devotion-heading">

            <span>
                RENUNGAN HARIAN
            </span>


            <h1>
                Firman Tuhan Hari Ini
            </h1>


            <p id="dailyDate"></p>

        </div>


        <!-- =============================================
             AYAT
        ============================================== -->

        <article
            class="devotion-card bible-card"
        >

            <div class="devotion-icon">
                📖
            </div>


            <p class="label">
                FIRMAN TUHAN
            </p>


            <blockquote
                id="dailyVerse"
            >
                Memuat ayat...
            </blockquote>


            <p
                id="dailyReference"
                class="reference"
            ></p>

        </article>


        <!-- =============================================
             REFLEKSI
        ============================================== -->

        <article
            class="devotion-card"
        >

            <div class="devotion-icon">
                🌿
            </div>


            <p class="label">
                REFLEKSI
            </p>


            <div
                id="dailyReflection"
                class="reflection"
            >
                Memuat refleksi...
            </div>

        </article>


        <!-- =============================================
             DOA
        ============================================== -->

        <article
            class="devotion-card prayer-card"
        >

            <div class="devotion-icon">
                🙏
            </div>


            <p class="label">
                DOA HARI INI
            </p>


            <div
                id="dailyPrayer"
                class="prayer-text"
            >
                Memuat doa...
            </div>

        </article>


        <div class="devotion-footer">

            <p>
                Renungan berganti setiap
                <strong>
                    Senin dan Kamis pukul 05.00 WIB
                </strong>.
            </p>

        </div>


    </div>

</main>


<footer>

    <h3>
        PDO SION
    </h3>


    <p>
        © 2026 PDO SION
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>

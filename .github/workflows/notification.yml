name: PDO SION Notification

on:
  # Untuk tes manual
  workflow_dispatch:

  # Jadwal otomatis WIB
  schedule:
    # Senin & Kamis - 05.00 WIB
    - cron: "0 5 * * 1,4"
      timezone: "Asia/Jakarta"

    # Setiap hari - 06.00 WIB
    - cron: "0 6 * * *"
      timezone: "Asia/Jakarta"

    # Setiap hari - 12.00 WIB
    - cron: "0 12 * * *"
      timezone: "Asia/Jakarta"

    # Setiap hari - 19.00 WIB
    - cron: "0 19 * * *"
      timezone: "Asia/Jakarta"


jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin@14.1.0

      - name: Send PDO SION Notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

        run: |
          cat > send-notification.mjs <<'EOF'

          import {
            initializeApp,
            cert
          } from "firebase-admin/app";

          import {
            getFirestore
          } from "firebase-admin/firestore";

          import {
            getMessaging
          } from "firebase-admin/messaging";


          // =================================================
          // FIREBASE ADMIN
          // =================================================

          const serviceAccount =
            JSON.parse(
              process.env.FIREBASE_SERVICE_ACCOUNT
            );

          initializeApp({
            credential: cert(serviceAccount)
          });

          const db = getFirestore();
          const messaging = getMessaging();


          // =================================================
          // WAKTU WIB
          // =================================================

          const now = new Date();

          const formatter =
            new Intl.DateTimeFormat(
              "en-US",
              {
                timeZone: "Asia/Jakarta",
                weekday: "long",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23"
              }
            );

          const parts =
            formatter.formatToParts(now);

          const weekday =
            parts.find(
              item => item.type === "weekday"
            )?.value;

          const hour =
            Number(
              parts.find(
                item => item.type === "hour"
              )?.value
            );

          const minute =
            Number(
              parts.find(
                item => item.type === "minute"
              )?.value
            );

          console.log(
            `Waktu WIB: ${weekday} ${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`
          );


          // =================================================
          // TENTUKAN PESAN
          // =================================================

          let title = "";
          let body = "";

          // -----------------------------------------------
          // TES MANUAL
          // -----------------------------------------------

          if (
            process.env.GITHUB_EVENT_NAME ===
            "workflow_dispatch"
          ) {

            title =
              "🔔 Tes PDO SION";

            body =
              "Notifikasi dari GitHub Actions berhasil!";

          }


          // -----------------------------------------------
          // SENIN & KAMIS - 05.00
          // -----------------------------------------------

          else if (

            hour === 5 &&

            (
              weekday === "Monday" ||
              weekday === "Thursday"
            )

          ) {

            title =
              "📖 Renungan Baru PDO SION";

            body =
              "Renungan hari ini sudah tersedia. Yuk luangkan waktu untuk membaca Firman Tuhan.";

          }


          // -----------------------------------------------
          // SETIAP HARI - 06.00
          // -----------------------------------------------

          else if (hour === 6) {

            title =
              "🙏 Pengingat PDO SION";

            body =
              "Sudahkah kamu membaca renungan hari ini?";

          }


          // -----------------------------------------------
          // SETIAP HARI - 12.00
          // -----------------------------------------------

          else if (hour === 12) {

            title =
              "🌿 Pengingat PDO SION";

            body =
              "Luangkan waktu sejenak untuk mengingat Firman Tuhan.";

          }


          // -----------------------------------------------
          // SETIAP HARI - 19.00
          // -----------------------------------------------

          else if (hour === 19) {

            title =
              "❤️ Pengingat PDO SION";

            body =
              "Mari kembali merenungkan Firman Tuhan hari ini.";

          }


          else {

            console.log(
              "Tidak ada jadwal notifikasi."
            );

            process.exit(0);

          }


          console.log("Judul:", title);
          console.log("Pesan:", body);


          // =================================================
          // AMBIL TOKEN DARI FIRESTORE
          // =================================================

          const snapshot =
            await db
              .collection("pushRegistrations")
              .get();


          const registrations =
            snapshot.docs
              .map(doc => ({
                id: doc.id,
                token: doc.data().token
              }))
              .filter(
                item =>
                  typeof item.token === "string" &&
                  item.token.length > 0
              );


          console.log(
            `Jumlah perangkat: ${registrations.length}`
          );


          if (registrations.length === 0) {

            console.log(
              "Tidak ada perangkat yang terdaftar."
            );

            process.exit(0);

          }


          // =================================================
          // KIRIM KE TOKEN
          // =================================================

          let totalSuccess = 0;
          let totalFailure = 0;


          for (
            let i = 0;
            i < registrations.length;
            i += 500
          ) {

            const batch =
              registrations.slice(i, i + 500);

            const message = {

              data: {
                title: title,
                body: body,
                url: "/renungan.html"
              },

              webpush: {
                headers: {
                  Urgency: "high"
                }
              },

              tokens:
                batch.map(
                  item => item.token
                )

            };


            console.log(
              `Mengirim batch ${Math.floor(i / 500) + 1}...`
            );


            const response =
              await messaging
                .sendEachForMulticast(
                  message
                );


            totalSuccess +=
              response.successCount;

            totalFailure +=
              response.failureCount;


            // ---------------------------------------------
            // HAPUS TOKEN YANG SUDAH TIDAK VALID
            // ---------------------------------------------

            for (
              let j = 0;
              j < response.responses.length;
              j++
            ) {

              const result =
                response.responses[j];

              if (!result.success) {

                const errorCode =
                  result.error?.code;

                console.error(
                  "Pengiriman gagal:",
                  errorCode
                );


                if (

                  errorCode ===
                    "messaging/registration-token-not-registered" ||

                  errorCode ===
                    "messaging/invalid-registration-token"

                ) {

                  try {

                    await db
                      .collection(
                        "pushRegistrations"
                      )
                      .doc(
                        batch[j].id
                      )
                      .delete();

                    console.log(
                      "Token tidak valid dihapus."
                    );

                  } catch (deleteError) {

                    console.error(
                      "Gagal menghapus token:",
                      deleteError
                    );

                  }

                }

              }

            }

          }


          // =================================================
          // HASIL AKHIR
          // =================================================

          console.log(
            "================================="
          );

          console.log(
            "PDO SION NOTIFICATION SELESAI"
          );

          console.log(
            "Berhasil:",
            totalSuccess
          );

          console.log(
            "Gagal:",
            totalFailure
          );

          console.log(
            "================================="
          );


          if (totalSuccess === 0) {
            process.exit(1);
          }

          EOF

          node send-notification.mjs
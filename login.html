<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - PDO SION</title>

    <link
        rel="stylesheet"
        href="PDO SION.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="login-page">


<div class="login-container">


    <div class="login-card">


        <div class="login-icon">

            <i class="fa-solid fa-church"></i>

        </div>


        <h1>
            PDO SION
        </h1>


        <p class="login-subtitle">
            Selamat datang di website PDO SION
        </p>


        <form id="loginForm">


            <div class="input-group">

                <label for="username">
                    Nama Pengguna
                </label>


                <div class="input-wrapper">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan nama kamu"
                        autocomplete="name"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                Masuk

            </button>


            <p
                id="loginStatus"
                class="login-status"
            ></p>


        </form>


    </div>


</div>


<!-- EmailJS -->

<script
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
></script>


<script
    src="login.js"
></script>


</body>

</html>
